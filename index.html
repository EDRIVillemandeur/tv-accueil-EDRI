<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="3600">
  <title>Accueil — EDRI Villemandeur</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="dashboard" aria-label="Tableau d'accueil">
    <section class="topbar">
      <div class="brand-block" aria-label="Logo de l'agence">
        <img class="agency-logo" src="logo-equans.png" alt="EQUANS Digital — Robotics & Automation">
        <div class="welcome-block">
          <p class="eyebrow">Bienvenue</p>
          <h1>Bienvenue chez <span>EQUANS Digital</span></h1>
          <p class="location">EDRI Villemandeur</p>
        </div>
      </div>

      <div class="clock-block">
        <time id="clock" class="clock">--:--</time>
        <div id="today" class="today">Chargement…</div>
      </div>
    </section>

    <section class="content-grid">
      <div class="video-card card">
        <div class="card-heading"><span>À découvrir</span><span class="live-dot">●</span></div>
        <div class="video-frame">
          <iframe
            src="https://www.youtube-nocookie.com/embed/xOe_2QgZXQc?autoplay=1&mute=1&controls=1&rel=0&loop=1&playlist=xOe_2QgZXQc&list=PLBlQy8tmk_XM"
            title="Vidéo de l'agence"
            allow="autoplay; encrypted-media; picture-in-picture"
            allowfullscreen></iframe>
        </div>
      </div>

    <aside class="side-column">
      <section class="weather-card card">
        <div class="card-heading">
          <span>Météo à Villemandeur</span>
          <span id="weather-icon" class="weather-icon">☁</span>
        </div>
    
        <div class="weather-main">
          <strong id="temperature">--°</strong>
          <div>
            <div id="weather-description">Chargement…</div>
            <small id="feels-like"></small>
          </div>
        </div>
    
        <div class="weather-details">
          <span>↑ <b id="max-temp">--°</b></span>
          <span>↓ <b id="min-temp">--°</b></span>
          <span>💧 <b id="humidity">--%</b></span>
        </div>
      </section>
    
      <section class="events-card card">
        <div class="card-heading">
          <span>Prochains événements</span>
          <span class="calendar-mark">▢</span>
        </div>
    
        <div id="events" class="events-list">
          <p class="muted">Chargement des événements…</p>
        </div>
      </section>
    </aside>

    <footer><span class="agency-footer">EDRI Villemandeur</span><span class="separator">•</span><span>45700 Villemandeur</span></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
